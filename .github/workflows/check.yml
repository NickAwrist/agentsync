name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cgo: 1
          # macOS clients run the cgo-free binaries from make dist. Go 1.22
          # also links cgo binaries without LC_UUID, which macOS won't load.
          - os: macos-latest
            cgo: 0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
      - name: Cross-compile client binaries
        if: runner.os == 'Linux'
        run: make dist
      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck internal/server/install.sh
