name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: Cross-compile client binaries
        if: runner.os == 'Linux'
        run: make dist
      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck internal/server/install.sh
